<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角色定位校準</title>
<link rel="stylesheet" href="dialogue.css"><style>
*{box-sizing:border-box}body{margin:20px;background:#24212c;color:#f4ead7;font:16px/1.5 sans-serif}a{color:#e6c977}main{display:grid;grid-template-columns:minmax(400px,1fr) 290px;gap:18px}#preview{position:relative;overflow:hidden;background:#15151d}#world{position:absolute;width:1280px;height:720px;transform-origin:top left;background:center/cover}#layer{position:absolute;top:54px;width:1280px;height:666px;overflow:visible}#actor{cursor:move;touch-action:none;transition:none!important}#actor img{width:100%;height:100%;object-fit:cover}#ground{position:absolute;left:0;width:1280px;border-top:3px dashed #ffd46d;cursor:ns-resize;touch-action:none;z-index:5}#ground span{background:#17131c;color:#ffd46d;padding:3px}#anchor{position:absolute;width:22px;height:22px;margin:-11px;border:3px solid white;border-radius:50%;background:#f4586a;cursor:crosshair;touch-action:none;z-index:6}label{display:block;margin:8px 0}input,select{max-width:100%;padding:5px}input[type=number]{width:100px}button{padding:8px;margin:5px 0}#status{white-space:pre-wrap}#warning{color:#ffd46d}#world:after{content:'定位預覽・非正式劇情';position:absolute;left:15px;top:10px;background:#17131cb8;padding:5px;pointer-events:none}#dialogue-guide{position:absolute;left:260px;right:260px;bottom:15px;height:150px;border:2px solid #dfc575;background:#18131caf;pointer-events:none;color:white;padding:12px}aside{padding:12px;background:#302a39}#file{display:none}@media(max-width:850px){main{display:block}aside{margin-top:16px}}
</style><style>#ground{transform:translateY(-2px)}#ground span{position:absolute;bottom:5px;right:8px}#actor img{pointer-events:none}</style><h1>角色定位校準</h1><p>拖曳角色調站位；拖曳黃線調地面；拖曳紅點校準素材腳底。縮放不移動腳底。<a href="story-review.html">回劇本試播</a></p>
<main><section><div id="preview"><div id="world"><div id="layer"><div id="actor" class="event-dialogue-portrait is-visible is-speaking"></div><div id="ground"><span>地面／腳底線</span></div><div id="anchor" role="button" aria-label="拖曳腳底錨點" tabindex="0"></div></div><div id="dialogue-guide">對話框遮擋參考（不會保存為劇本）</div></div></div><p id="warning"></p><p id="status" role="status"></p></section>
<aside><label>角色 <select id="character"></select></label><label>場景 <select id="scene"></select></label><label>站位 <select id="position"><option value="left">左</option><option value="center" selected>中</option><option value="right">右</option></select></label><label><input id="show-guide" type="checkbox" checked> 顯示對話框遮擋參考</label>
<label>角色大小 % <input id="scale" type="number" min="10" max="300" step="1"></label><label>地面高度 % <input id="groundValue" type="number" min="0" max="150" step="0.5"></label><label>水平微調 % <input id="xOffset" type="number" min="-20" max="20" step="0.5"></label><label>腳底錨點 X <input id="anchorX" type="number" step="0.5"></label><label>腳底錨點 Y <input id="anchorY" type="number" step="0.5"></label>
<p>地面 100%＝角色區下緣。錨點可在圖片外；工具不會補畫缺少的腿腳。</p><button id="save">保存此角色＋場景</button><button id="reset">恢復自動落地（待保存）</button><hr><button id="export">匯出定位備份</button><button id="import">匯入定位備份</button><input id="file" type="file" accept=".json,application/json"><p>同一瀏覽器來源的正式遊戲與 AI 劇本共用定位；不寫來源 Excel 或進度存檔、不發布。</p></aside></main><script type="module" src="portrait-placement-editor.js"></script></html>
