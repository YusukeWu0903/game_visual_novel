<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>慾之穹頂 - 視覺小說</title>
  <link rel="stylesheet" href="/src/style.css" />
  <link rel="stylesheet" href="/stardom/dialogue.css" />
  <link rel="stylesheet" href="/src/integration.css" />
</head>
<body>
  <div id="app"><main id="game-container">
    <section id="start-screen">
      <div class="home-backdrop" aria-hidden="true"></div>
      <div class="home-portraits" aria-hidden="true"></div>
      <div class="home-menu">
      <h1>慾之穹頂</h1>
      <div class="home-rule" aria-hidden="true"></div>
      <div class="btn-group">
        <button id="start-btn">開始新遊戲</button>
        <button id="load-btn">讀取進度</button>
        <label class="story-label" for="story-select">移植示範劇情</label>
        <select id="story-select">
          <option value="Event0004">分層動態立繪・雙角色演出</option>
          <option value="Event0003">選項分支・獎勵・音訊</option>
          <option value="Event0005">黑幕旁白・CG・場景恢復</option>
        </select>
        <a href="/legacy.html">原版對照（霞／劍舞）</a>
      </div>
      <p id="menu-status" role="status"></p>
      </div>
      <div class="companion-caption"><span id="companion-name">角色載入中…</span><div class="companion-dots" role="group" aria-label="首頁角色"></div></div>
    </section>
  </main></div>
  <div id="viewport-guidance" class="viewport-guidance" hidden role="alert"><p></p></div>
  <div id="modal-root"></div>
  <script type="module" src="/src/stardom-bootstrap.js"></script>
</body>
</html>
